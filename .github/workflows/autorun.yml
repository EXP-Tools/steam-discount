name: Automatically Crawl Steam Discount
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    branches:
      - master
  schedule:
    - cron: '0 12 * * *'


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 当仓库隶属组织时，赋予流水线“写权限”以便提交变更
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Test crawler
        run: python -m unittest discover -s tests -v

      - name: Crawl Steam Discount
        if: ${{ github.event_name != 'pull_request' }}
        env:
          CRAWL_PWD: ${{ secrets.CRAWL_PWD }}
          PAGES: ${{ secrets.PAGES }}
          ZONE: ${{ secrets.ZONE }}
          FILTER: ${{ secrets.FILTER }}
          LIMIT: ${{ secrets.LIMIT }}
        run: |-
          python main.py -g "$CRAWL_PWD" -p "${PAGES:-4}" -z "${ZONE:-CN}" -f "${FILTER:-globaltopsellers}" -l "${LIMIT:-100}" -s


      # 如果不希望污染 commit 记录，user.email 和 user.name 随便填即可
      # Github Runner 是有权限提交到仓库的，只要 user 不是 owner ，当次 commit 不会被记录
      - name: Commit and push Github page (if changed)
        if: ${{ github.event_name != 'pull_request' }}
        run: |-
          git diff
          git config --global user.email "github-bot@example.com"
          git config --global user.name "Github-Bot"
          git add -A
          git commit -m "Updated by Github Bot" || exit 0
          git push origin master

